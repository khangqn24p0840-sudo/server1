services:
  api:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  # HTTPS tự động (Let's Encrypt). Cần một tên miền trỏ về IP máy chủ + mở cổng 80/443.
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data: